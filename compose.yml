services:
  core:
    build: ./ac1
    environment:
      IA_URL: http://ia:8001
    ports: ['127.0.0.1:8084:8080']
  ia:
    build: ./ia
  prometheus:
    image: prom/prometheus:v3.0.1
    ports: ['127.0.0.1:9094:9090']
    volumes: ['./operacao/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
  grafana:
    image: grafana/grafana:11.3.0
    ports: ['127.0.0.1:3004:3000']
    volumes:
      - ./operacao/datasource.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
      - ./operacao/provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./operacao/dashboard.json:/var/lib/grafana/dashboards/b1.json:ro
